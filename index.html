<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171A1D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ANGGARAN — RAB dan realisasi proyek konstruksi, cepat dan offline." />
  <title>ANGGARAN</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell" data-layout="mobile">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div class="brand-block">
        <div class="brand-mark">A</div>
        <div>
          <div class="brand-name">ANGGARAN</div>
          <div class="brand-subtitle">Kontrol proyek</div>
        </div>
      </div>
      <nav class="desktop-nav" id="desktopNav"></nav>
      <div class="sidebar-foot">Data tersimpan di perangkat ini.</div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <button class="project-switcher" id="projectSwitcher" type="button" aria-label="Pilih proyek">
          <span class="project-switcher-label">PROYEK</span>
          <span class="project-switcher-value" id="projectNameHeader">Belum ada proyek</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <button class="icon-button" id="quickAddButton" type="button" aria-label="Catat realisasi baru">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama"></nav>
  </div>

  <div id="overlayRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
