<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171A1D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="ANGGARAN — pencatatan keuangan per project, omzet, pengeluaran, dan untung/rugi." />
  <title>ANGGARAN</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell" data-layout="mobile">
    <main class="main-shell">
      <header class="topbar">
        <div class="header-brand" aria-label="ANGGARAN">
          <span class="header-brand-mark" aria-hidden="true"><span class="header-brand-letter">A</span></span>
          <strong>ANGGARAN</strong>
        </div>
        <span class="header-divider" aria-hidden="true"></span>
        <button class="project-switcher" id="projectSwitcher" type="button" aria-label="Pilih proyek">
          <span class="project-switcher-label">PROYEK</span>
          <span class="project-switcher-value" id="projectNameHeader">Belum ada proyek</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <button class="header-settings" id="settingsButton" type="button" aria-label="Pengaturan">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.5 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.5-1-2 3.5 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.5-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.5 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
        </button>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama"></nav>
  </div>

  <div id="overlayRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
